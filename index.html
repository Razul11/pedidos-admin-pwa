<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos - Admin</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#198754">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light" >

    <div class="container py-4" style="max-width: 500px;">

        <!-- Encabezado -->
        <div class="text-center mb-4">

            <div class="d-inline-flex align-items-center justify-content-center bg-info text-dark rounded-circle shadow mb-3"
                style="width:70px; height:70px;">
                <i class="bi bi-receipt-cutoff fs-2"></i>
            </div>

            <h2 class="fw-bold mb-1">
                Pedidos Recibidos
            </h2>

            <p class="text-muted small mb-0">
                Gestiona los pedidos pendientes y entregados
            </p>

        </div>

        <!-- Estadísticas -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">

            <div class="card-body">

                <div class="row text-center">

                    <div class="col">

                        <div class="fw-bold fs-4 text-warning" id="contador-pendientes">

                        </div>

                        <small class="text-muted">
                            Pendientes
                        </small>

                    </div>

                    <div class="col">

                        <div class="fw-bold fs-4 text-success" id="contador-entregados">

                        </div>

                        <small class="text-muted">
                            Entregados
                        </small>

                    </div>

                </div>

            </div>

        </div>

        <!-- Filtros -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">

            <div class="card-body">

                <div class="btn-group w-100">

                    <button id="btn-filtro-pendientes" class="btn btn-warning fw-semibold">
                        <i class="bi bi-clock-history me-2"></i>
                        Pendientes
                    </button>

                    <button id="btn-filtro-entregados" class="btn btn-outline-success fw-semibold">
                        <i class="bi bi-check2-circle me-2"></i>
                        Entregados
                    </button>

                </div>

            </div>

        </div>

        <!-- Lista -->
        <div class="card border-0 shadow-sm rounded-4">

            <div class="card-body">

                <h5 class="fw-bold mb-3">
                    <i class="bi bi-list-ul me-2"></i>
                    Lista de Pedidos
                </h5>

                <div id="contenedor-pedidos">
                    <!-- Estado vacío -->
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1"></i>
                        <p class="mt-3 mb-0">No hay pedidos para mostrar.</p>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalEntregado" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-body text-center p-4">

                    <div class="bg-success text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                        style="width:70px;height:70px;">
                        <i class="bi bi-check-lg fs-2"></i>
                    </div>
                    <h4 class="fw-bold">
                        ¡Pedido Entregado!
                    </h4>
                    <p id="modal-mensaje-entregado" class="text-muted mb-4"></p>
                    <button type="button" class="btn btn-success w-100" data-bs-dismiss="modal">
                        Aceptar
                    </button>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js" type="module"></script>

</body>

</html>
